# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `agent`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] map cổng ra ngoài (8000:8000)
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${AGENT_API_KEY}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /health
#
# ĐIỂM CỘNG: thêm service `nginx` làm load balancer (nginx/nginx.conf đã có sẵn)
#     docker compose up --scale agent=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # TODO (CP2): khai báo service `agent` ở đây
  agent:
    build: .
    # Không map cứng "8000:8000": khi `--scale agent=3` cả 3 container sẽ
    # tranh nhau cùng một cổng host. Để Docker tự cấp cổng ngẫu nhiên, còn
    # cổng 8000 do nginx giữ và chia tải xuống các instance.
    ports:
      - "8000"
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - PORT=${PORT:-8000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('PORT', '8000') + '/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ĐIỂM CỘNG (CP4): load balancer đứng trước các instance agent.
  # Docker DNS trả về IP của cả 3 container cho hostname `agent`, nginx gửi
  # request luân phiên (round-robin) — nên hai lượt hỏi liên tiếp của cùng
  # một user có thể rơi vào hai container khác nhau. Đó là lý do lịch sử hội
  # thoại phải nằm ở Redis chứ không nằm trong RAM của từng process.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy


volumes:
  redis-data:
